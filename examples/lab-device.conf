# Example lan-scan rule: a device that prints a gate line before its SSH
# banner, identified only by the passive evidence it volunteers.
schema     = 1
kind       = lab-device
label      = Example lab device
profile    = lab
ports      = 22
hosts      = 192.0.2.9
match      = ssh.gate == unlocked
match      = ssh.banner ~ dropbear
confidence = definitive
